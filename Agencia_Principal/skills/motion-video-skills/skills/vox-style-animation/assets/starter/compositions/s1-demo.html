<template id="s1-demo-template">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=block" rel="stylesheet" />

  <div
    data-composition-id="s1-demo"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <div class="stage">
      <!-- dot fields: the unifying texture. These carry the 12fps "Vox stutter". -->
      <div class="dots dots-tl"></div>
      <div class="dots dots-br"></div>

      <div class="type-stage">
        <div class="line-1"><span class="lead">YOUR EDITORIAL LEAD LINE</span></div>
        <div class="line-2">
          <span class="hero">ONE <span class="hl">BIG<span class="hl-block"></span></span> IDEA</span>
        </div>
      </div>

      <!-- a label that thunks in crooked (editorial imperfection) -->
      <div class="stamp">EXHIBIT A</div>

      <!-- the one transition device -->
      <div class="sheet-wipe"></div>
      <div class="paper-edge"></div>
      <div class="grain"></div>
    </div>

    <style>
      [data-composition-id="s1-demo"] {
        position: absolute; inset: 0; overflow: hidden;
        background: #f2ecdf;
      }
      [data-composition-id="s1-demo"] .stage { position: absolute; inset: 0; }

      [data-composition-id="s1-demo"] .dots {
        position: absolute;
        width: 640px; height: 640px;
        background-image: radial-gradient(circle, rgba(22,21,19,0.13) 2.2px, transparent 2.6px);
        background-size: 18px 18px;
        pointer-events: none;
      }
      [data-composition-id="s1-demo"] .dots-tl { top: -170px; left: -170px; }
      [data-composition-id="s1-demo"] .dots-br { bottom: -170px; right: -170px; }

      [data-composition-id="s1-demo"] .type-stage {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -54%);
        text-align: center;
        width: 100%;
      }
      [data-composition-id="s1-demo"] .lead {
        display: inline-block; opacity: 0;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.22em;
        color: #161513;
      }
      [data-composition-id="s1-demo"] .line-2 { margin-top: 30px; }
      [data-composition-id="s1-demo"] .hero {
        position: relative;
        display: inline-block;
        opacity: 0;
        font-family: 'Archivo Black', sans-serif;
        font-size: 168px;
        line-height: 1;
        color: #161513;
      }
      /* highlighter marker — a REAL child element (not a ::before, so GSAP can
         tween it). Yellow block behind ONE key word; scaleX 0->1 in the timeline.
         Never color-change the text; the marker is the whole device. */
      [data-composition-id="s1-demo"] .hl {
        position: relative;
        display: inline-block;
        z-index: 0;
      }
      [data-composition-id="s1-demo"] .hl-block {
        position: absolute;
        z-index: -1;
        inset: 6% -0.08em -4% -0.08em;
        background: #ffd200;
        transform: scaleX(0);
        transform-origin: left center;
      }

      [data-composition-id="s1-demo"] .stamp {
        position: absolute;
        top: 100px; right: 130px;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.18em;
        color: #e5483f;
        border: 4px solid #e5483f;
        padding: 10px 22px;
        transform: rotate(6deg) scale(0);
        box-shadow: 5px 6px 0 rgba(22,21,19,0.16);
        background: #fff;
      }

      [data-composition-id="s1-demo"] .sheet-wipe {
        position: absolute;
        top: -5%; bottom: -5%;
        left: -10%; right: -10%;
        background: #e9e1cf;
        border-left: 6px solid #161513;
        border-right: 6px solid #161513;
        transform: translateX(-115%);
        z-index: 40;
      }
      [data-composition-id="s1-demo"] .paper-edge {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 62%, rgba(22,21,19,0.07) 100%);
      }
      [data-composition-id="s1-demo"] .grain {
        position: absolute; inset: 0; pointer-events: none;
        opacity: 0.55;
        background-image:
          radial-gradient(circle at 1px 1px, rgba(22,21,19,0.05) 1px, transparent 0),
          radial-gradient(circle at 3px 2px, rgba(22,21,19,0.035) 1px, transparent 0),
          radial-gradient(circle at 2px 5px, rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 3px 3px, 5px 5px, 7px 7px;
      }
    </style>

    <script>
      (() => {
        const SLOT = 6;
        const tl = gsap.timeline({ paused: true });
        const sel = (q) => `[data-composition-id="s1-demo"] ${q}`;

        // camera never sleeps — slow drift on the type stage
        tl.fromTo(sel('.type-stage'), { scale: 1.0 }, { scale: 1.03, duration: SLOT, ease: 'none' }, 0);

        // dot-field pan — the ONLY place the 12fps Vox stutter lives
        tl.to(sel('.dots-tl'), { backgroundPosition: '18px 18px', duration: SLOT, ease: 'steps(' + Math.round(SLOT * 12) + ')' }, 0);
        tl.to(sel('.dots-br'), { backgroundPosition: '-18px -18px', duration: SLOT, ease: 'steps(' + Math.round(SLOT * 12) + ')' }, 0);

        // 1) editorial lead rises
        tl.fromTo(sel('.lead'), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: 'expo.out' }, 0.3);

        // 2) hero PAPER SLAP-IN — oversized, blur-in, settles flat
        tl.fromTo(sel('.hero'),
          { scale: 1.18, opacity: 0, rotation: -1.2, filter: 'blur(14px)' },
          { scale: 1, opacity: 1, rotation: 0, filter: 'blur(0px)', duration: 0.55, ease: 'power3.out' }, 1.15);

        // 3) HIGHLIGHTER SWIPE under the one key word
        tl.to(sel('.hl-block'), { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 1.7);

        // label thunks in crooked
        tl.to(sel('.stamp'), { scale: 1, duration: 0.45, ease: 'back.out(1.3)' }, 2.4);

        // 4) SHEET-WIPE — the one transition device carries the cut
        tl.to(sel('.sheet-wipe'), { x: '230%', duration: 0.4, ease: 'power3.in' }, 5.35);

        tl.to({}, { duration: SLOT }, 0); // Law #11 anchor
        window.__timelines = window.__timelines || {};
        window.__timelines['s1-demo'] = tl;
      })();
    </script>
  </div>
</template>
